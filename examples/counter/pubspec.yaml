name: sailfish_counter
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.0
  path_provider: ^2.1.0
  # The Linux implementations are pure Dart; they are registered by hand in main.dart
  # because the build does not go through the flutter tool's plugin registrant yet.
  shared_preferences_linux: ^2.4.0
  path_provider_linux: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
